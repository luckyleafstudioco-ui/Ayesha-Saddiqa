<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PennyWise - Expense Tracker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f7fb;
  color: #172033;
}

header {
  background: #ffffff;
  padding: 22px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 12px #dfe5ee;
}

.logo {
  color: #635bdb;
  font-size: 25px;
  font-weight: bold;
}

header span {
  color: #718096;
  font-size: 14px;
}

.container {
  max-width: 1100px;
  margin: 35px auto;
  padding: 0 20px;
}

h1 {
  font-size: 30px;
  margin-bottom: 8px;
}

.subtitle {
  color: #7b8497;
  margin-bottom: 28px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 28px;
}

.card, .panel {
  background: white;
  border-radius: 16px;
  padding: 23px;
  box-shadow: 0 4px 18px #e5eaf2;
}

.card p {
  color: #788196;
  font-size: 14px;
  margin-bottom: 15px;
}

.card h2 {
  font-size: 25px;
  overflow-wrap: anywhere;
}

.income h2 { color: #16a36a; }
.expenses h2 { color: #e34c67; }
.balance h2 { color: #635bdb; }

.content {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 22px;
  align-items: start;
}

.panel h2 {
  font-size: 20px;
  margin-bottom: 22px;
}

label {
  display: block;
  margin-bottom: 8px;
  margin-top: 16px;
  font-size: 14px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #dce2ec;
  border-radius: 9px;
  background: white;
  font-size: 14px;
  color: #172033;
}

input:focus, select:focus {
  outline: 2px solid #c6c2ff;
  border-color: #635bdb;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 9px;
  padding: 12px 16px;
  font-weight: bold;
  transition: 0.2s;
}

.add-btn {
  background: #635bdb;
  color: white;
  width: 100%;
  margin-top: 22px;
}

.add-btn:hover {
  background: #4941bd;
}

.transaction-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 18px;
}

.transaction-top h2 {
  margin-bottom: 0;
}

.filter {
  max-width: 145px;
}

.transaction {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid #edf0f5;
  padding: 16px 0;
}

.transaction:last-child {
  border-bottom: none;
}

.transaction-info {
  min-width: 0;
}

.transaction-info strong {
  display: block;
  margin-bottom: 6px;
  overflow-wrap: anywhere;
}

.transaction-info small {
  color: #8790a3;
}

.amount {
  text-align: right;
  font-weight: bold;
  white-space: nowrap;
}

.amount.plus { color: #16a36a; }
.amount.minus { color: #e34c67; }

.delete-btn {
  background: #fff0f2;
  color: #d93651;
  margin-top: 7px;
  padding: 6px 9px;
  font-size: 12px;
}

.empty {
  text-align: center;
  color: #8a93a5;
  padding: 35px 0;
}

footer {
  text-align: center;
  color: #8a93a5;
  padding: 30px 15px;
  font-size: 13px;
}

@media (max-width: 760px) {
  .summary {
    grid-template-columns: 1fr;
  }

  .content {
    grid-template-columns: 1fr;
  }

  header {
    padding: 20px;
  }

  .container {
    margin-top: 25px;
  }

  h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ PennyWise</div>
  <span>Personal Finance Dashboard</span>
</header>

<main class="container">
  <h1>My Expense Tracker</h1>
  <p class="subtitle">Manage your money. Reach your goals.</p>

  <section class="summary">
    <div class="card income">
      <p>↗️ Total Income</p>
      <h2 id="totalIncome">PKR 0</h2>
    </div>

    <div class="card expenses">
      <p>↘️ Total Expenses</p>
      <h2 id="totalExpenses">PKR 0</h2>
    </div>

    <div class="card balance">
      <p>◈ Available Balance</p>
      <h2 id="balance">PKR 0</h2>
    </div>
  </section>

  <section class="content">
    <div class="panel">
      <h2>＋ Add Transaction</h2>

      <form id="transactionForm">
        <label for="description">Description</label>
        <input
          id="description"
          type="text"
          placeholder="e.g. Grocery shopping"
          maxlength="80"
          required
        >

        <label for="amount">Amount (PKR)</label>
        <input
          id="amount"
          type="number"
          placeholder="e.g. 2500"
          min="0.01"
          max="1000000000000"
          step="0.01"
          required
        >

        <label for="type">Transaction Type</label>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Education</option>
          <option>Bills</option>
          <option>Health</option>
          <option>Salary</option>
          <option>Freelancing</option>
          <option>Other</option>
        </select>

        <label for="date">Date</label>
        <input id="date" type="date" required>

        <button class="add-btn" type="submit">
          + Add Transaction
        </button>
      </form>
    </div>

    <div class="panel">
      <div class="transaction-top">
        <h2>Recent Transactions</h2>
        <select class="filter" id="filter" aria-label="Filter transactions">
          <option value="all">All</option>
          <option value="income">Income</option>
          <option value="expense">Expenses</option>
        </select>
      </div>

      <div id="transactionList">
        <div class="empty">No transactions yet. Add your first one!</div>
      </div>
    </div>
  </section>
</main>

<footer>
  PennyWise ©️ 2026 · Every rupee counts.
</footer>

<script>
const form = document.getElementById("transactionForm");
const list = document.getElementById("transactionList");
const filter = document.getElementById("filter");

const money = new Intl.NumberFormat("en-PK", {
  style: "currency",
  currency: "PKR",
  maximumFractionDigits: 2
});

document.getElementById("date").value =
  new Date().toLocaleDateString("en-CA");

let transactions = [];

try {
  const saved = JSON.parse(
    localStorage.getItem("pennywise-transactions") || "[]"
  );

  if (Array.isArray(saved)) {
    transactions = saved.filter(t =>
      t &&
      typeof t.id === "string" &&
      typeof t.description === "string" &&
      typeof t.amount === "number" &&
      Number.isFinite(t.amount) &&
      t.amount > 0 &&
      ["income", "expense"].includes(t.type) &&
      typeof t.category === "string" &&
      typeof t.date === "string"
    );
  }
} catch {
  transactions = [];
}

function saveTransactions() {
  try {
    localStorage.setItem(
      "pennywise-transactions",
      JSON.stringify(transactions)
    );
    return true;
  } catch {
    alert("Unable to save data in this browser. Check browser storage settings.");
    return false;
  }
}

function render() {
  const income = transactions
    .filter(t => t.type === "income")
    .reduce((sum, t) => sum + t.amount, 0);

  const expenses = transactions
    .filter(t => t.type === "expense")
    .reduce((sum, t) => sum + t.amount, 0);

  document.getElementById("totalIncome").textContent =
    money.format(income);

  document.getElementById("totalExpenses").textContent =
    money.format(expenses);

  document.getElementById("balance").textContent =
    money.format(income - expenses);

  const filtered = transactions
    .filter(t => filter.value === "all" || t.type === filter.value)
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  list.replaceChildren();

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No transactions to show.";
    list.appendChild(empty);
    return;
  }

  filtered.forEach(t => {
    const row = document.createElement("div");
    row.className = "transaction";

    const info = document.createElement("div");
    info.className = "transaction-info";

    const title = document.createElement("strong");
    title.textContent = t.description;

    const details = document.createElement("small");
    details.textContent = `${t.category} · ${t.date}`;

    info.append(title, details);

    const right = document.createElement("div");

    const amount = document.createElement("div");
    amount.className =
      "amount " + (t.type === "income" ? "plus" : "minus");

    amount.textContent =
      (t.type === "income" ? "+ " : "− ") + money.format(t.amount);

    const remove = document.createElement("button");
    remove.className = "delete-btn";
    remove.textContent = "Delete";

    remove.addEventListener("click", () => {
      const previous = transactions;
      transactions = transactions.filter(item => item.id !== t.id);

      if (saveTransactions()) {
        render();
      } else {
        transactions = previous;
        render();
      }
    });

    right.append(amount, remove);
    row.append(info, right);
    list.appendChild(row);
  });
}

form.addEventListener("submit", event => {
  event.preventDefault();

  const description =
    document.getElementById("description").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  if (!description || !Number.isFinite(amount) || amount <= 0) {
    alert("Please enter a description and a valid amount.");
    return;
  }

  const transaction = {
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random(),
    description,
    amount,
    type: document.getElementById("type").value,
    category: document.getElementById("category").value,
    date: document.getElementById("date").value
  };

  transactions.unshift(transaction);

  if (saveTransactions()) {
    form.reset();
    document.getElementById("date").value =
      new Date().toLocaleDateString("en-CA");
    render();
  } else {
    transactions.shift();
  }
});

filter.addEventListener("change", render);

render();
</script>

</body>
</html>
